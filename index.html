<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14263c"><meta name="description" content="حاسبة نسب البنوك التفاعلية"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>الحاسبه التفاعلية</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:#f4f7fb;color:#172b46;min-height:100vh;display:grid;place-items:center;padding:18px}.card{background:white;border:1px solid #e2e8f0;border-radius:22px;padding:22px;width:min(100%,460px);box-shadow:0 12px 38px #193c6412}h1{font-size:23px;margin:0 0 24px}label{display:block;font-weight:650;margin-bottom:9px}input{width:100%;border:1px solid #bdc9d7;border-radius:12px;font-size:25px;padding:13px 16px;direction:ltr;text-align:center;outline-color:#3971bd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.result{background:#f0f4f9;padding:15px 10px;border-radius:14px;text-align:center}.result small{display:block;font-size:13px;color:#61738a;margin-bottom:8px}.result strong{font-size:24px;direction:ltr;display:block}.final{text-align:center;margin-top:19px;padding:19px;border-top:1px solid #e5eaf0}.final small{display:block;color:#52667e;font-weight:600}.final strong{font-size:40px;color:#15805a;display:block;direction:ltr;margin-top:6px}.hint{font-size:13px;color:#738298;text-align:center;margin:0}.error{color:#bc3443;min-height:18px;font-size:13px;margin-top:7px}</style></head><body><main class="card"><h1>الحاسبه التفاعلية</h1><label for="rate">اكتب عمولة البنك الأصلية (%)</label><input id="rate" inputmode="decimal" type="text" value="15" placeholder="مثلاً 15" aria-describedby="error"><div class="error" id="error"></div><section class="grid"><div class="result"><small>شامل ضريبة 14%</small><strong id="tax">17.10%</strong></div><div class="result"><small>المتبقي من 100%</small><strong id="remaining">82.90%</strong></div></section><section class="final"><small>النسبة النهائية</small><strong id="final">20.63%</strong></section><p class="hint">تتحدث النتائج تلقائيًا عند تغيير النسبة</p></main><script>const input=document.getElementById('rate'),tax=document.getElementById('tax'),remaining=document.getElementById('remaining'),final=document.getElementById('final'),error=document.getElementById('error');function update(){let raw=input.value.trim().replace('٪','').replace('%','').replace('٫','.').replace('،','.').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c));const n=Number(raw);if(raw===''||!Number.isFinite(n)||n<0||n*1.14>=100){tax.textContent=remaining.textContent=final.textContent='—';error.textContent='اكتب نسبة صحيحة أقل من 87.72%';return}error.textContent='';const t=n*1.14,r=100-t;tax.textContent=t.toFixed(2)+'%';remaining.textContent=r.toFixed(2)+'%';final.textContent=(t/r*100).toFixed(2)+'%'}input.addEventListener('input',update);update();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
